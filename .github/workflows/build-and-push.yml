name: Publish Docker image

on:
  push:
    branches:
      - next

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/arv-live/obs-docker:latest
            ${{ secrets.REGISTRY_URL }}/arv-live/obs-docker:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.REGISTRY_URL }}/arv-live/obs-docker:buildcache
          cache-to: type=registry,ref=${{ secrets.REGISTRY_URL }}/arv-live/obs-docker:buildcache,mode=max
